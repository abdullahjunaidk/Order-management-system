externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: rohit.vilas.ingole@gmail.com
    name: Rohit Vilas Ingole
  description: This is the API for Gopher Social, a social media platform for Gophers.
  license:
    name: MIT License
    url: https://github.com/DataRohit/Order-Management-System/blob/master/license
  title: Gopher Social API
  version: "1.0"
paths:
  /auth/activate/{activationToken}:
    get:
      consumes:
      - application/json
      description: Activate a User in the Platform
      parameters:
      - description: Activation Token
        in: path
        name: activationToken
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully activated user
          schema:
            $ref: '#/definitions/models.UserRegisterSuccessResponse'
        "500":
          description: Failed to activate the user
          schema:
            $ref: '#/definitions/models.UserRegisterErrorResponse'
      summary: Activate a User
      tags:
      - Auth
  /auth/admin/login:
    post:
      consumes:
      - application/json
      description: Login an Admin to the Platform
      parameters:
      - description: Admin Login Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.UserLoginPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged in admin
          schema:
            $ref: '#/definitions/models.AdminLoginSuccessResponse'
        "400":
          description: Failed to login the admin
          schema:
            $ref: '#/definitions/models.AdminLoginErrorResponse'
        "500":
          description: Failed to login the admin
          schema:
            $ref: '#/definitions/models.AdminLoginErrorResponse'
      summary: Login Admin
      tags:
      - Auth
  /auth/customer/register:
    post:
      consumes:
      - application/json
      description: Register a new User to the Platform
      parameters:
      - description: User Register Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.UserRegisterPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully registered user
          schema:
            $ref: '#/definitions/models.UserRegisterSuccessResponse'
        "400":
          description: Failed to register the user
          schema:
            $ref: '#/definitions/models.UserRegisterErrorResponse'
        "500":
          description: Failed to register the user
          schema:
            $ref: '#/definitions/models.UserRegisterErrorResponse'
      summary: Register a new User
      tags:
      - Auth
  /auth/employee/activate/{activationToken}:
    get:
      consumes:
      - application/json
      description: Activate an Employee in the Platform
      parameters:
      - description: Activation Token
        in: path
        name: activationToken
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully activated employee
          schema:
            $ref: '#/definitions/models.EmployeeActivateSuccessResponse'
        "500":
          description: Failed to activate the employee
          schema:
            $ref: '#/definitions/models.EmployeeActivateErrorResponse'
      summary: Activate an Employee
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Forgot Password for a User
      parameters:
      - description: Forgot Password Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.ForgotPasswordPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully sent password reset email
          schema:
            $ref: '#/definitions/models.ForgotPasswordSuccessResponse'
        "400":
          description: Failed to send password reset email
          schema:
            $ref: '#/definitions/models.ForgotPasswordErrorResponse'
        "500":
          description: Failed to send password reset email
          schema:
            $ref: '#/definitions/models.ForgotPasswordErrorResponse'
      summary: Forgot Password
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a User to the Platform
      parameters:
